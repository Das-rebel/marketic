name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e .[dev]
      - name: Import hygiene
        run: |
          ! grep -rn "from marketic\." --include="*.py" . | grep -v npm_dist | grep -v _salvage | grep -v "^./crm/"
      - name: Tests
        run: pytest tests/ -v --tb=short
